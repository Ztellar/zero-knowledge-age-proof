[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
jmrtd = "0.8.9"
scuba-android = "0.0.27"
bouncycastle = "1.86"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
jmrtd = { module = "org.jmrtd:jmrtd", version.ref = "jmrtd" }
scuba-android = { module = "net.sf.scuba:scuba-sc-android", version.ref = "scuba-android" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
