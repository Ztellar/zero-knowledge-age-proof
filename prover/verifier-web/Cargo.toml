[package]
name = "verifier-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Demo web verifier: shows a QR with a challenge and checks the phone's age presentation (decision 0005)"

[dependencies]
age-core = { path = "../core" }
age-verifier = { path = "../verifier" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
hex = "0.4"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
