[package]
name = "age-prover-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "age_prover"
crate-type = ["cdylib"]

[dependencies]
age-core = { path = "../core" }
bincode = "1"
facematch = { path = "../facematch" }
image = { version = "=0.25.10", default-features = false }
jni = { version = "=0.21.1", default-features = false }
methods = { path = "../methods" }
# In-process prover: there is no r0vm on Android.
risc0-zkvm = { version = "^3.0.6", features = ["prove"] }
